# First-run profile for the Switch/ARM64 F.E.A.R. build.
# The Switch input driver reports letter positions as printed on the Joy-Con;
# set input.xbox_layout = true if you prefer Xbox-position prompts.

[nx]
renderer = "native"

[input]
xbox_layout = false

[audio]
# Begin with ReXGlue's queue-consumption pacing until FEAR's mixer is validated.
switch_bomba = false

[switch]
# Keep zero-timeout guest waits at yield semantics for the first compatibility run.
poll_sleep_us = 0

# Use the system default handheld profile during initial compatibility testing.
gpu_mhz = 0
allow_ram_1600 = false
nvmap_mb = 0
ab_lap_after_s = 0

[log]
level = "info"
flush_level = "warn"
flush_interval = 1
