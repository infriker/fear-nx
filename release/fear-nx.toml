# F.E.A.R. NX release settings. See docs/native-renderer.md.
[nx]
native_shared_resolves = true
native_gpu_profile = true
native_max_anisotropy = 2
native_depth24 = true
native_msaa = false
native_async_pipelines = true
native_record_thread = false
renderer = "native"
native_trace_output = true

[input]
xbox_layout = false

[audio]
switch_bomba = false

[switch]
mesa_env = ""
poll_sleep_us = 0

gpu_mhz = 0
allow_ram_1600 = false
nvmap_mb = 0
ab_lap_after_s = 0

[log]
level = "debug"
flush_level = "debug"
flush_interval = 1

[gpu]
specialize_texture_signs = true
