# F.E.A.R. NX release settings. See docs/native-renderer.md.
# No shader dumps or verbose decoder output. Keep shader/pipeline caches enabled.
dump_shaders = ""
ffmpeg_verbose = false
[nx]
# Dynamic water/mirror reflections; restart after changing.
planar_reflections = false
# Keep volumetric lighting, with half the Xbox 360 slice count. 0 restores game default.
volumetric_light_slices = 128
# Keep volumetric shadows with a smaller map. 0 restores game default.
volumetric_light_shadow_size = 64
# Large mipmapped BC textures: use mip 1 or coarser. 0 restores game selection.
native_texture_min_mip = 1
native_shared_resolves = true
native_gpu_profile = false
native_max_anisotropy = 2
native_depth24 = true
native_msaa = false
native_async_pipelines = true
native_record_thread = false
native_fused_gamma = true
native_zcull = true
native_precise_resolve_barriers = true
native_full_clear_load_op = true
renderer = "native"
native_trace_output = false

[input]
xbox_layout = false
# Gyro is on by default and works only while aiming.
# To disable: L + R + D-pad Right -> Input -> uncheck input_gyro_enabled
# -> Save to config, or set gyro_enabled = false below.
# Uses the actual weapon aim state, including toggle aim and alternate layouts.
gyro_enabled = true
gyro_sensitivity = 1.0
gyro_smoothing_ms = 16.0
gyro_deadzone_dps = 0.15
gyro_invert_y = false

[audio]
switch_bomba = false

[switch]
mesa_env = ""
poll_sleep_us = 0

gpu_mhz = 0
allow_ram_1600 = false
nvmap_mb = 0
ab_lap_after_s = 0
perf_report = false

[log]
level = "off"
flush_level = "off"
flush_interval = 0
verbose = false
noisy = false

[gpu]
specialize_texture_signs = true
implicit_lod_sampling = true
native_verify = false
page_hash_validation = false
native_stats = false
cp_fastpath_stats = false
debug_markers = false
texture_last_view_cache_stats = false

[vulkan]
validation_enabled = false
log_debug_messages = false
tessellation_wireframe = false
