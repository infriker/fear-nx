# Windows-validated renderer fixes; this NRO still requires Switch hardware verification.
# First-run profile for the Switch/ARM64 F.E.A.R. build.
# The Switch input driver reports letter positions as printed on the Joy-Con;
# set input.xbox_layout = true if you prefer Xbox-position prompts.

[nx]
# Direct writes into a common destination; no post-resolve segment composition.
native_shared_resolves = true
# Measure GPU passes on one frame in 16; disable after diagnosis.
native_gpu_profile = true
# Limit anisotropic texture filtering to 2x.
native_max_anisotropy = 2
# Compact depth storage; check depth/stencil-dependent effects in gameplay.
native_depth24 = true
native_msaa = false
native_async_pipelines = true
native_record_thread = false
renderer = "native"
native_trace_output = true

[input]
xbox_layout = false

[audio]
# Begin with ReXGlue's queue-consumption pacing until FEAR's mixer is validated.
switch_bomba = false

[switch]
mesa_env = ""
# Keep zero-timeout guest waits at yield semantics for the first compatibility run.
poll_sleep_us = 0

# Use the system default handheld profile during initial compatibility testing.
gpu_mhz = 0
allow_ram_1600 = false
nvmap_mb = 0
ab_lap_after_s = 0

[log]
level = "debug"
flush_level = "debug"
flush_interval = 1

[gpu]
# Specialize texture signedness/gamma at pipeline creation.
specialize_texture_signs = true
